# ===================================================================
# ОБЩИЕ НАСТРОЙКИ ПРИЛОЖЕНИЯ (Безопасно для GitHub)
# ===================================================================
spring.application.name=tms-backend

# ===================================================================
# БАЗА ДАННЫХ (Использует переменные окружения Railway, либо локальные значения по умолчанию)
# ===================================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/Logus}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:qwer}

# Оптимизация пула соединений для облачных сред (Railway/Supabase)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# HIBERNATE / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
# Явное указание диалекта предотвращает ошибки при запуске в облаке
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===================================================================
# ИНИЦИАЛИЗАЦИЯ ДАННЫХ (Для выполнения data.sql с категориями грузов)
# ===================================================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===================================================================
# ЗАГРУЗКА ФАЙЛОВ (Для чата поддержки и вложений)
# ===================================================================
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# СЕРВЕР
# ===================================================================
# Railway автоматически задает порт через переменную PORT, локально будет 8080
server.port=${PORT:8080}